[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-metrics-service"
version = "0.1.0"
description = "Risk Metrics Service for Fund Monitoring (Tracking Error 12M)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-filter>=24.2",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.2",
    "gunicorn>=22.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["config", "risk"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
